name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Firebase Configuration
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f app/google-services.json.template ]; then
            cp app/google-services.json.template app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Production Release APK
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          COMMITS=$(git rev-list --count HEAD || echo "1")
          echo "Building Production Release APK for version: ${CLEAN_VER} (code: ${COMMITS})"
          ./gradlew assembleRelease -PappVersionName="${CLEAN_VER:-1.0.0}" -PappVersionCode="${COMMITS:-1}"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/waqt-${{ github.ref_name || 'latest' }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/waqt-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

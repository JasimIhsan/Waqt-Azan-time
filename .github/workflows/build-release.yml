name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.3)'
        required: true
        default: '1.0.3'
      title:
        description: 'Release Title (optional)'
        required: false
        default: 'Waqt Release'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Production Release APK
        run: |
          VERSION_INPUT="${{ github.event.inputs.version || '1.0.3' }}"
          CLEAN_VER="${VERSION_INPUT#v}"
          COMMITS=$(git rev-list --count HEAD || echo "1")
          echo "Building Production Release APK for version: ${CLEAN_VER} (code: ${COMMITS})"
          ./gradlew assembleRelease -PappVersionName="${CLEAN_VER}" -PappVersionCode="${COMMITS}"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_INPUT="${{ github.event.inputs.version || '1.0.3' }}"
          CLEAN_VER="${VERSION_INPUT#v}"
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/waqt-v${CLEAN_VER}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/waqt-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.3' }}
          name: ${{ github.event.inputs.title || format('Waqt v{0}', github.event.inputs.version || '1.0.3') }}
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
